name: kernel

# Feasibility check for the XNU build, mirroring UniXNU's own macos.yml:
# same host tools, same defconfig, same `unixnu build kernel`.  It publishes
# text logs only -- UniXNU's workflow is explicit that kernels, payloads and
# IPSW members are never uploaded because they derive from Apple software, and
# this one keeps that rule.
#
# What this answers: can the Linux/macOS kernel step run end to end for tb321fu
# at all, and if not, which input is missing.  It does not produce a kernel we
# can boot; that needs a host that may keep the artifact.

on:
  workflow_dispatch:
  push:
    paths:
      - 'devices/**'
      - '.github/workflows/kernel.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  kernel:
    # Pinned image: macos-latest moves, and the kernel step needs an Xcode whose
    # clang accepts the flags the XNU build passes.
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Announce the run
        run: |
          set +e
          {
            echo "run ${GITHUB_RUN_ID} commit ${GITHUB_SHA}"
            echo "started $(date -u +%FT%TZ)"
            echo "runner ${ImageOS:-unknown}"
          } > state.txt
          mkdir -p /tmp/pub && cp state.txt /tmp/pub/kernel-state.txt
          cd /tmp/pub
          git init -q
          git -c user.email=ci@example.com -c user.name=ci checkout -q -b kernel-log
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -qm "run started"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kernel-log || true

      - name: Fetch UniXNU
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/UniXNU/UniXNU.git devices/UniXNU
          git -C devices/UniXNU checkout 13e5973748a8447cbb90520c9a2dd5e65e272435
          git -C devices/UniXNU log -1 --oneline

      - name: Install host tools
        run: |
          set -euo pipefail
          brew install llvm lld mtools dtc unifdef python@3.12 || brew install llvm lld mtools dtc python@3.12
          # The CLI needs Python 3.11+ (tomllib); the image's python3 is 3.9.
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"
          if ! command -v unifdef >/dev/null; then echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"; fi

      - name: Report the toolchain
        run: |
          sw_vers; uname -m; xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true
          python3 --version; python3.12 --version || true; df -h "$GITHUB_WORKSPACE"

      - name: Build kernel
        working-directory: devices/UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            # zzz-boot-progress.patch adds boot_progress_* instrumentation and is applied last;
            # the patches before it already rewrote bsd_init.c, so its hunks no longer match.
            # It is diagnostic, not a boot requirement, so set it aside to see what is behind it.
            # The os series lists the shared zzz-boot-progress patch, but the arch series
            # (56 patches) already rewrote bsd_init.c by the time it runs, so its hunks no
            # longer match.  Drop the line instead of the file: removing the file trips the
            # 'patch missing' check in patches.plan().
            sed -i.bak '/zzz-boot-progress/d' profiles/os/ipados-17.7.11-21H461/patches/xnu/series
            cat profiles/os/ipados-17.7.11-21H461/patches/xnu/series
            echo "== defconfig"
            python3.12 unixnu defconfig tb321fu_defconfig -D ../UniXNU-tb321fu
            echo "== fetch"
            python3.12 unixnu fetch
            echo "== build"
            python3.12 unixnu build kernel
          } > /tmp/build.log 2>&1
          rc=$?
          tail -60 /tmp/build.log
          if [ $rc -ne 0 ]; then
            # Annotations render without a session; step logs and summaries do not.
            echo "::error title=kernel step failed::$(tail -8 /tmp/build.log | tr '\n' ' ' | cut -c1-900)"
            mkdir -p /tmp/pub && cp /tmp/build.log /tmp/pub/kernel-build.log
            cd /tmp/pub
            git init -q
            git -c user.email=ci@example.com -c user.name=ci checkout -q -b kernel-log
            git add -A
            git -c user.email=ci@example.com -c user.name=ci commit -qm "kernel build log"
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kernel-log || true
            exit $rc
          fi

      - name: Report the result
        if: always()
        working-directory: devices/UniXNU
        run: |
          set +e
          f=$(find out -name 'kernel.macho' -type f | head -1)
          if [ -n "$f" ]; then
            # Numbers only: UniXNU's workflow deliberately never publishes kernels
            # or other Apple-derived binaries, and this repository is public.
            echo "::notice title=kernel built::$f $(stat -f%z "$f") bytes sha256 $(shasum -a 256 "$f" | cut -c1-16)"
            ls -l "$(dirname "$f")"
          else
            echo "::warning title=no kernel::out/ has no kernel.macho"
          fi

      - name: Publish the kernel to the kernel-out branch
        if: success()
        working-directory: devices/UniXNU
        run: |
          set -euo pipefail
          src=$(dirname "$(find out -name 'kernel.macho' -type f | head -1)")
          [ -n "$src" ] || { echo "no kernel.macho"; exit 1; }
          mkdir -p /tmp/out
          cp "$src"/kernel.macho /tmp/out/
          [ -f "$src/kernel.macho.adt" ] && cp "$src/kernel.macho.adt" /tmp/out/ || true
          cd /tmp/out
          git init -q
          git -c user.email=ci@example.com -c user.name=ci checkout -q -b kernel-out
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -qm "kernel.macho $(date -u +%FT%TZ)"
          # The repository is private: this is transport for one device, not publication.
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kernel-out
          ls -l /tmp/out

      - name: Upload the text logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-logs
          path: |
            devices/UniXNU/out/**/logs/*.log
            devices/UniXNU/out/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish the run state
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          {
            echo "commit ${GITHUB_SHA}"
            echo "job ${GITHUB_JOB}"
            echo "started at $(date -u +%FT%TZ)"
            echo "--- out/ ---"
            ls -l out/*/*/*/kernel 2>/dev/null || echo "no kernel directory"
            echo "--- build log tail ---"
            tail -40 /tmp/build.log 2>/dev/null || echo "no /tmp/build.log"
          } > /tmp/state.txt
          mkdir -p /tmp/pub && cp /tmp/state.txt /tmp/pub/kernel-state.txt
          cd /tmp/pub
          git init -q
          git -c user.email=ci@example.com -c user.name=ci checkout -q -b kernel-log
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -qm "run state"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kernel-log || true
