name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (DEBUG prints boot progress to the console)'
        type: choice
        options: [RELEASE, DEBUG]
        default: DEBUG

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Bring-up means many one-line iterations.  Without this cache every
      # push pays for a fresh Mu-Silicium clone, all its submodules and a
      # cold EDK2 build; with it the tree, the submodules, the python venv
      # and Build/ survive between runs, so a change costs minutes instead
      # of twenty.  build.sh still runs `git checkout -f $MU_COMMIT`, which
      # throws away the previous run's source patches, so the patched files
      # are never reused in their patched state.
      - name: Restore build tree
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/work/uefi
            ${{ runner.temp }}/work/.venv
          key: mu-3aa95a72-${{ hashFiles('scripts/build.sh') }}
          restore-keys: |
            mu-3aa95a72-

      # Resolve the target once. A dispatched run uses the chosen input; a push
      # uses DEBUG for now, because the firmware currently dies before BDS and
      # only the DEBUG build prints anything at all -- a RELEASE image leaves
      # the screen on the ABL logo with no text, which tells us nothing.
      - name: Resolve target
        id: t
        run: |
          TARGET="${{ github.event.inputs.target }}"
          if [ -z "$TARGET" ]; then TARGET="DEBUG"; fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "building $TARGET"

      - name: Install build dependencies
        timeout-minutes: 12
        run: |
          set -eux
          # Run 96 sat inside `apt-get update` for over 17 minutes while the
          # whole build was still pending behind it.  The default acquire
          # timeout is far too generous for a stalled Ubuntu mirror, so cap it
          # and let a bad mirror fail fast instead of hanging the job.
          APT="sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          $APT update
          $APT install -y --no-install-recommends \
            build-essential git python3 python3-venv \
            clang llvm lld uuid-dev nasm \
            gcc-aarch64-linux-gnu acpica-tools device-tree-compiler \
            mono-runtime ca-certificates-mono
          # NuGet runs on mono here; without a populated mono certificate store
          # the fetch from the Project Mu feed fails with a bare "We failed to
          # install this version".
          sudo cert-sync /etc/ssl/certs/ca-certificates.crt || true
          mono --version | head -1

      - name: Build the boot image
        run: |
          set -o pipefail
          bash ./scripts/build.sh "$RUNNER_TEMP/work" "${{ steps.t.outputs.target }}" 2>&1 \
            | tee "$RUNNER_TEMP/build-sh.log"

      # The job log endpoint needs admin rights even on a public repository, so
      # a failed build would otherwise be completely opaque from the outside.
      # EDK2 writes every compiler diagnostic into BUILDLOG_kirbyPkg.txt.  Print
      # it, and also publish it to a ci-log branch: that branch is readable with
      # a plain anonymous git clone, which is how a red run actually gets
      # diagnosed from this side.
      - name: Publish build log on failure
        if: failure()
        run: |
          set -eu
          f="$RUNNER_TEMP/work/uefi/Build/BUILDLOG_kirbyPkg.txt"
          if [ ! -f "$f" ]; then
            echo "no BUILDLOG at $f"
            ls -la "$RUNNER_TEMP/work/uefi/Build" 2>/dev/null || true
            exit 0
          fi
          echo "=== BUILDLOG_kirbyPkg.txt (tail 400) ==="
          tail -400 "$f"

          PUB="$RUNNER_TEMP/failog"
          mkdir -p "$PUB"
          tail -800 "$f" > "$PUB/BUILDLOG-tail.txt"
          # build.sh's own output.  Run 105 died before EDK2 ever started and the
          # BUILDLOG therefore still held the previous build, which told us
          # nothing about the failure.
          if [ -f "$RUNNER_TEMP/build-sh.log" ]; then
            tail -200 "$RUNNER_TEMP/build-sh.log" > "$PUB/build-sh-tail.txt"
          fi
          printf 'commit %s\ntarget %s\n' "${{ github.sha }}" "${{ steps.t.outputs.target }}" > "$PUB/FAILED.txt"
          cd "$PUB"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ci-log
          git add -A
          git commit -q -m "build log ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log

      - name: Report
        run: |
          img=$(ls "$RUNNER_TEMP"/work/uefi/Mu-kirby-0.img)
          {
            echo "### Mu-kirby-0.img (${{ steps.t.outputs.target }})"
            echo '```'
            ls -l "$img"
            sha256sum "$img"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The FV path contains the target name, so it has to be resolved rather
      # than hardcoded -- a DEBUG build writes to DEBUG_CLANGPDB, and the old
      # hardcoded RELEASE_CLANGPDB path silently uploaded nothing.
      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: Mu-kirby-${{ steps.t.outputs.target }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/work/uefi/Mu-kirby-0.img
            ${{ runner.temp }}/work/uefi/Build/kirbyPkg/${{ steps.t.outputs.target }}_CLANGPDB/FV/SILICIUM_UEFI.fd
            ${{ runner.temp }}/work/uefi/Build/BUILDLOG_kirbyPkg.txt
          retention-days: 30

      # Actions artifacts need a GitHub login even on a public repository, so
      # they cannot be fetched from a plain URL. Publish the image to a
      # dedicated single-commit branch instead: raw.githubusercontent.com serves
      # it anonymously, which makes each build directly downloadable and keeps
      # the repo from growing (the branch is force-pushed, so only one blob set
      # ever exists on it).
      - name: Publish image to artifacts branch
        run: |
          set -eu
          PUB="$RUNNER_TEMP/pub"
          mkdir -p "$PUB"
          cp "$RUNNER_TEMP/work/uefi/Mu-kirby-0.img" "$PUB/Mu-kirby-${{ steps.t.outputs.target }}.img"
          cp "$RUNNER_TEMP/work/uefi/Build/kirbyPkg/${{ steps.t.outputs.target }}_CLANGPDB/FV/SILICIUM_UEFI.fd" \
             "$PUB/SILICIUM_UEFI-${{ steps.t.outputs.target }}.fd"
          printf '%s  %s\n' "$(sha256sum "$PUB/Mu-kirby-${{ steps.t.outputs.target }}.img" | cut -d' ' -f1)" \
             "Mu-kirby-${{ steps.t.outputs.target }}.img" > "$PUB/SHA256SUMS"
          # Keep build.sh's tail next to BUILD-INFO: it is the only place that
          # records whether the SEC patch applied and how big the ramdisk was,
          # and it is readable anonymously through this branch.
          {
            printf 'commit %s\ntarget %s\n' "${{ github.sha }}" "${{ steps.t.outputs.target }}"
            echo '--- build.sh tail ---'
            tail -40 "$RUNNER_TEMP/build-sh.log" 2>/dev/null || true
          } > "$PUB/BUILD-INFO.txt"

          cd "$PUB"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b artifacts
          git add -A
          git commit -q -m "build ${{ github.sha }} (${{ steps.t.outputs.target }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" artifacts
          echo "published to the artifacts branch"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/work/uefi/Mu-kirby-0.img
          body: |
            kirby (Lenovo Legion Y700 Gen3 / TB321FU / SM8650) UEFI firmware.

            Flash without writing anything to the tablet:

            ```
            adb reboot bootloader
            fastboot boot Mu-kirby-0.img
            ```

            Press any volume key while the logo is on screen to enter the boot
            menu, otherwise the firmware finds no boot option and powers off.
