name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 python3-venv \
            clang llvm lld uuid-dev nasm \
            gcc-aarch64-linux-gnu acpica-tools device-tree-compiler \
            mono-runtime ca-certificates-mono
          # NuGet runs on mono here; without a populated mono certificate store
          # the fetch from the Project Mu feed fails with a bare "We failed to
          # install this version".
          sudo cert-sync /etc/ssl/certs/ca-certificates.crt || true
          mono --version | head -1

      - name: Build the boot image
        run: bash ./scripts/build.sh "$RUNNER_TEMP/work" RELEASE

      - name: Report
        run: |
          img=$(ls "$RUNNER_TEMP"/work/uefi/Mu-kirby-0.img)
          {
            echo "### Mu-kirby-0.img"
            echo '```'
            ls -l "$img"
            sha256sum "$img"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: Mu-kirby-RELEASE
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/work/uefi/Mu-kirby-0.img
            ${{ runner.temp }}/work/uefi/Build/kirbyPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
            ${{ runner.temp }}/work/uefi/Build/BUILDLOG_kirbyPkg.txt
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/work/uefi/Mu-kirby-0.img
          body: |
            kirby (Lenovo Legion Y700 Gen3 / TB321FU / SM8650) UEFI firmware.

            Flash without writing anything to the tablet:

            ```
            adb reboot bootloader
            fastboot boot Mu-kirby-0.img
            ```

            Press any volume key while the logo is on screen to enter the boot
            menu, otherwise the firmware finds no boot option and powers off.
