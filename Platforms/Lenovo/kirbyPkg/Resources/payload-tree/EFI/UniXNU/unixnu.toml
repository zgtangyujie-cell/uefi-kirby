version = 1

#
# kirby bring-up payload.
#
# The kernel was built from Apple's source in CI (xnu-10063.141.1 with the
# UniXNU patch series) and delivered on the kernel-out branch; build.sh copies
# it into Payloads/ while the volume is written.
#
# No dtb key on purpose.  UniXNULib/Inject.c:364-368 resolves dtb="firmware"
# through gFdtTableGuid and returns EFI_NOT_FOUND when the table/header is
# absent; and Boot.c:86 would then hand a non-NULL DeviceTree to DarwinBoot,
# which rejects it outright (DarwinBoot.c:605-608).  Official payload config
# (docs/concepts/payload.md:35-42) has no dtb at all.  The ADT sidecar
# Payloads/kernel.macho.adt is what XNU actually consumes.
#
# Zero: boot the default entry at once.  Menu.c:152 returns the default index
# without even creating a timer when RemainingMs == 0, so this skips the menu
# entirely.  The hand-off is already verified from the Mach-O (entry pa
# 0x831F4488, entry words 140006f5), so no countdown photograph is needed and
# every extra second only delays the next test.
# fallback_timeout is the retry delay after a failed boot (Main.c:169 clears
# Countdown); Config.c:1390 clamps it to at least 1.
[boot]
timeout = 0
fallback_timeout = 1
default = "xnu"

[[entry]]
id = "xnu"
title = "XNU"
type = "xnu"
path = "Payloads/kernel.macho"
initrd = "Payloads/restore_apfs.img"
# offline-mobile-graphics-load / -client are the two boot args this kernel
# actually implements (verified against the kernel string table).  They gate
# native_mobile_graphics_load_probe and the provider probe that is nested
# inside native_mobile_graphics_client_probe, so neither runs without them.
#
# rd=md0 is deliberately absent for now: the payload carries a 1 MiB placeholder
# instead of a real APFS container, and asking the kernel to mount md0 before
# that exists risks parking it on a device wait instead of failing cleanly.
# The 176 MiB container cannot go in yet either: measured on the tablet, a
# 240 MiB payload volume kills the firmware 124 s in, and a 139 MiB boot image
# never reaches UEFI at all.
#
# QcomXnuUsbDebug needs both of these, and their spellings are deliberately
# different (grep of the sources, not the docs):
#   -enable_kprintf_spam  xnu's own pe_kprintf.c:49 under #elif DEVELOPMENT.
#                         The leading dash is part of the name and it takes no
#                         value; without it a DEVELOPMENT kernel leaves
#                         disable_kprintf_output true and kprintf is gated off,
#                         so the USB sink would receive nothing.
#   qcom-usb-debug=1      0002-qcom-usb-debug-worker.patch:214, which returns
#                         unless the value is exactly 1.  Without it the module
#                         never touches the controller.
#
# --- qcom-usb-diag history, measured, in order ---------------------------------
#
# Round A (commit 8e26660, image sha256 0d979f47): qcom-usb-diag=2.
#   Mode 2 is diag_reset(0) at the very top of qcom_usb_debug_init()
#   (QcomXnuUsbDebug.c:746), i.e. inside PE_init_kprintf and before acquire(),
#   and diag_reset reaches platform_smc_reset(): PSCI SYSTEM_RESET, w0 =
#   0x84000009, then an unconditional `for (;;) wfe` (QcomXnuUsbDebug.c:103).
#   Measured reset: 136.3 s, from wall clock minus /proc/uptime.  That is the
#   ~130 s watchdog, not zero.
#
#   Two readings survive that number, and they are not distinguishable by time
#   alone, which is exactly why this file now carries diag=1 instead:
#     (a) the SMC returned instead of resetting, so diag_reset fell into `wfe`
#         and the watchdog collected the board at ~136 s; the whole
#         entry-probe bisect log in scripts/build.sh rests on this same SMC and
#         would inherit the same uncertainty;
#     (b) the kernel never reached PE_init_kprintf, so nothing fired at all.
#
# Round B (this run): qcom-usb-diag=1.  Mode 1 does nothing up front and only
#   acts when acquire() refuses:
#       fail(QCOM_USB_DEBUG_ACQUIRE_REFUSED, 0);     /* error = 21 */
#       diag_reset(12u + 4u * native.status.error);  /* = 96 s */
#   so one boot now separates three outcomes that Round A could not:
#     * reset at ~96 s    -> SMC resets the board.  Reading (a) is wrong and the
#                            kernel does reach PE_init_kprintf; 96 = 12 + 4*21
#                            names ACQUIRE_REFUSED, so the refusal is inside
#                            acquire(), not in the boot-arg chain.
#     * reset at ~136 s   -> SMC does not reset.  Reading (a) holds, every
#                            diag/probe "reset" on this board has been the
#                            watchdog, and time-based probing has to stop.
#     * USB 1209:316d enumerates and no reset happens -> acquire() succeeded, so
#                            the kernel ran the whole init; the log channel is up
#                            and diag is no longer needed at all.
#   Nothing is written to any partition: the only observable is a reset delay.
args = "-v offline-mobile-graphics-load=1 offline-mobile-graphics-client=1 -enable_kprintf_spam qcom-usb-debug=1 qcom-usb-diag=1"
enabled = true
