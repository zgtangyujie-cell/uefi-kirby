version = 1

#
# kirby bring-up payload.
#
# The kernel was built from Apple's source in CI (xnu-10063.141.1 with the
# UniXNU patch series) and delivered on the kernel-out branch; build.sh copies
# it into Payloads/ while the volume is written.
#
# No dtb key on purpose.  UniXNULib/Inject.c:364-368 resolves dtb="firmware"
# through gFdtTableGuid and returns EFI_NOT_FOUND when the table/header is
# absent; and Boot.c:86 would then hand a non-NULL DeviceTree to DarwinBoot,
# which rejects it outright (DarwinBoot.c:605-608).  Official payload config
# (docs/concepts/payload.md:35-42) has no dtb at all.  The ADT sidecar
# Payloads/kernel.macho.adt is what XNU actually consumes.
#
# Zero: boot the default entry at once.  Menu.c:152 returns the default index
# without even creating a timer when RemainingMs == 0, so this skips the menu
# entirely.  The hand-off is already verified from the Mach-O (entry pa
# 0x831F4488, entry words 140006f5), so no countdown photograph is needed and
# every extra second only delays the next test.
# fallback_timeout is the retry delay after a failed boot (Main.c:169 clears
# Countdown); Config.c:1390 clamps it to at least 1.
[boot]
timeout = 0
fallback_timeout = 1
default = "xnu"

[[entry]]
id = "xnu"
title = "XNU"
type = "xnu"
path = "Payloads/kernel.macho"
initrd = "Payloads/restore_apfs.img"
# offline-mobile-graphics-load / -client are the two boot args this kernel
# actually implements (verified against the kernel string table).  They gate
# native_mobile_graphics_load_probe and the provider probe that is nested
# inside native_mobile_graphics_client_probe, so neither runs without them.
#
# rd=md0 is deliberately absent for now: the payload carries a 1 MiB placeholder
# instead of a real APFS container, and asking the kernel to mount md0 before
# that exists risks parking it on a device wait instead of failing cleanly.
# The 176 MiB container cannot go in yet either: measured on the tablet, a
# 240 MiB payload volume kills the firmware 124 s in, and a 139 MiB boot image
# never reaches UEFI at all.
#
# QcomXnuUsbDebug needs both of these, and their spellings are deliberately
# different (grep of the sources, not the docs):
#   -enable_kprintf_spam  xnu's own pe_kprintf.c:49 under #elif DEVELOPMENT.
#                         The leading dash is part of the name and it takes no
#                         value; without it a DEVELOPMENT kernel leaves
#                         disable_kprintf_output true and kprintf is gated off,
#                         so the USB sink would receive nothing.
#   qcom-usb-debug=1      0002-qcom-usb-debug-worker.patch:214, which returns
#                         unless the value is exactly 1.  Without it the module
#                         never touches the controller.
#
# --- qcom-usb-diag removed.  The whole diag mechanism is unusable here. -------
#
# work/measure_reset.log records every reset instant this project ever measured,
# as wall clock minus /proc/uptime, and not one of them is short:
#
#     vfs_mountroot      136.9 s
#     console            137.0 s
#     prelink            144.4 s
#     apfsload           144.3 s
#     diag2-4f4e91c      136.8 s   <- diag=2, which must fire in well under 2 s
#
# diag=2 is diag_reset(0) at the top of qcom_usb_debug_init(), inside
# PE_init_kprintf and before acquire().  It cannot legitimately take 136.8 s.
# Neither can the "console" probe.  Five different probe points landing inside
# 136-144 s is one event, not five: the ~130 s watchdog.
#
# The mechanism: diag_reset() ends in platform_smc_reset()
# (QcomXnuUsbDebug.c:92-104), which issues PSCI SYSTEM_RESET (w0 = 0x84000009)
# and then spins in `for (;;) __asm__ volatile("wfe")`.  If the SMC returns
# instead of resetting, the kernel parks there with DAIF masked and the watchdog
# is the only thing left to end the boot.  136.8 s for a call that should be
# instantaneous says exactly that.
#
# This also voids soc/Sm8650.h:36-46, which claims the SMC reset is "qualified
# by the diagnostic reset ... 122 s and again 137 s".  Those two numbers sit in
# the same watchdog band.  patch-xnu-entry-probe.py's --reset-delay defaults to
# 6 s, so a working SMC would have shown ~6 s, never ~122 s.
#
# Consequence for every time-based probe on this board: worthless.  diag=2 was
# not "refusing"; it was spinning in wfe at the first kprintf -- which is also
# why the panel never showed a single kernel character, since this runs inside
# PE_init_kprintf while PE_kputc is still being chosen.
#
# So no diag argument at all.  qcom-usb-debug=1 alone lets qcom_usb_debug_init()
# run to its own conclusion: on success the CDC device 1209:316d enumerates and
# the log channel is up; on refusal the kernel keeps booting instead of parking,
# so the console gets its chance and the refusal stays readable in software
# state rather than through a reset that never happens.
# --- round B result: dropping diag changed nothing, so the module is the suspect
#
# fc9c69f shipped the args below with qcom-usb-debug=1 and no diag.  Measured:
#
#     fc9c69f: RESET happened 132.5 s after fastboot boot returned
#     1209:316d never appeared (collect-win.py waited 500 s)
#
# 132.5 s sits in the same watchdog band as every earlier measurement, and this
# build contains no diag_reset() call at all -- so nothing in this image issues a
# PSCI reset.  The 132.5 s reset can only be the watchdog, which means the kernel
# hung somewhere after arm_init.c:536 and never came back.
#
# acquire() cannot be that hang.  Its first check is cpu_number() != master_cpu;
# cpu_number() is getCpuDatap()->cpu_number (osfmk/arm/cpu_common.c:828),
# getCpuDatap() is current_thread()->machine.CpuDatap (osfmk/arm/cpu_data.h:123),
# and arm_init.c:449-452 sets that to &BootCpuData with
# BootCpuData.cpu_number = master_cpu (:438).  The two are equal by construction,
# and usb_busy is static zero.  So this build did enter the DWC3 work.
#
# That leaves the module's own hardware access as the prime suspect.  Its
# polling loop is bounded to 5 s, and out: releases the lock, so the code cannot
# wait forever by itself.  A single DWC3 MMIO read can: this project already
# recorded on 2026-11-08 that reading DWC3 while its branch clock is gated stalls
# the interconnect, which is why the GCC probe reads only GCC.
#
# Round C therefore sets qcom-usb-debug=0.  acquire() still takes and releases
# usb_busy, then PE_parse_boot_argn returns 0 != 1 and the function goes straight
# to `out` (QcomXnuUsbDebug.c:759-761) -- no GCC, no DWC3, no SMMU, no MMIO at
# all.  The question is purely: does the kernel stop dying at ~132 s?
#
#   no reset within 420 s, or adb never returns -> the module's hardware access is
#       what hangs the board, and the next step is to narrow which register
#       (GCC read first, DWC3 after checking the branch clock)
#   still ~132 s -> the module is innocent, the hang is elsewhere between
#       arm_init.c:536 and BSD init, and the module can go back to =1
# --- debug=0x8: without it kprintf never reaches PE_kputc at all --------------
#
# pe_kprintf.c:105 gates the whole output path on
#
#     if (!disable_serial_output && !disable_kprintf_output) { ... PE_kputc ... }
#     else { os_log_with_args(...); }
#
# disable_serial_output starts TRUE (pe_kprintf.c:21) and only
# PE_init_kprintf_config clears it, and only when the boot arg sets the flag:
#
#     debug_boot_arg & DB_KPRT   --  pe_kprintf.c:41-43, DB_KPRT = 0x8
#
# -enable_kprintf_spam clears disable_kprintf_output, which is the *other* half
# (pe_kprintf.c:47-51), so with both halves the sink runs -- but this image has
# never passed debug= at all.  disable_serial_output has therefore been TRUE on
# every round so far, kprintf has always taken the os_log_with_args branch, and
# PE_kputc has never been called once.  That is why the panel shows no kernel
# character and why a USB sink hooked to PE_kputc could never receive a byte even
# with the controller up.
#
# The two reference devices both pass it: sheng-ref and kebab-ref ship
# `-v serial=3 debug=0x14e`, and 0x14e = 0x2|0x4|0x8|0x40|0x100 with 0x8 = DB_KPRT.
# DB_HALT (0x1) is not set, so nothing stops at boot.  Only 0x8 is used here: the
# other bits in 0x14e are obsolete or unrelated (DB_NMI, DB_ARP), and there is no
# reason to switch them on.
args = "-v debug=0x8 offline-mobile-graphics-load=1 offline-mobile-graphics-client=1 -enable_kprintf_spam qcom-usb-debug=1"
enabled = true
