schema_version = 2

# Lenovo Legion Y700 Gen 3 (TB321FU) / SM8650 (kirby / pineapple)
#
# 格式 2 设备仓库。字段依据：
#   - https://unixnu.com/zh/porting/device-repository#board-toml （格式 2 规范）
#   - UniXNU-caihong/board.toml （同 SoC SM8650 的既有设备仓库，格式 1；
#     只继承与 SoC / IPSW 相关的通用值，格式 1 专用的 tool / archives 不照抄）
#   - 01-设备输入.md （本机只读实测：SM8650 / 16 GiB / 1600x2560 / A-B 分区）
#   - uefi-kirby-main/Resources/Configs/kirby.toml （当前 bring-up 固件，
#     已用 fastboot boot 实测可启动）
# 标 REQUIRED_ / TODO 的字段必须从本机实测补齐，不要猜。

[board]
name = "tb321fu"
soc = "SM8650"
soc_source = "sm8650"          # TODO: UniXNU-sm8650-common 尚未存在；feeds.toml 里也是 REQUIRED_SOC_COMMIT
os_profile = "ipados-17.7.11-21H461"
description = "Lenovo Legion Y700 Gen 3 (TB321FU), SM8650, 1600x2560 165Hz, NT36523 panel, NVT touch"
kit = "tb321fu"

# 最小闭环：先只选输入已满足的实现（官方第 6 步）。
# 显示 / 触控 / GPU 驱动等 bring-up 阶段 1 通过后再加。
#
# 存储走设备级内核补丁 patches/xnu/kirby-ufs.patch（BSD bdevsw，
# 端口自 UniXNU-kebab），**不选 ShengUfs 组件**：ShengUfs 的
# NativeUfsBlock 继承 IOBlockStorageDevice，那是 IOStorageFamily 的类，
# 而 IOStorageFamily 只在 prelink 的 kernelcache kexts 里。这台机器用
# --skip-prelink 构建（256 MiB 窗口放不下 65 MiB prelinked 跨度），
# 链接时 libShengUfs.a 会报 vtable for IOBlockStorageDevice 未定义。
# BSD bdevsw 只用 buf/conf/devfs，内核自带，不依赖任何 kext。
[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot",
           "GopFramebuffer"]

# 与 caihong / giulia 相同的 SM8650 目标：iPad7,1 / iPadOS 17.7.11 (21H461)。
# 01-设备输入.md 附录：ADT 会伪造平台身份，IPSW 机型与平板无关，可沿用。
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache",
         "RestoreRamDisk", "RestoreTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# 本机 GPT 实测，三个独立来源交叉一致（都不抄 caihong）：
#   - 02-阶段计划.md（11/5 只读 sgdisk）：first_lba = 3613096 / last_lba = 123365370
#   - TB321FU_HyperOS3_0209/image/gpt_main0.bin（LUN0 GPT 条目）：first_lba = 3613096，
#     模板里 last_lba = 3613095（长度 0），因为 userdata 由 patch*.xml 扩展到磁盘末尾。
#   - 2026-11-08 00:30 复核实测（root，只读），刷机后仍然一致 —— TODO 关闭：
#       Disk /dev/block/sda: 123365376 sectors, 470.6 GiB
#       Sector size (logical/physical): 4096/4096
#        16  3613096  123365370  456.8 GiB  A03A  userdata
#     注意整盘只有一个 LUN（sda），16 个分区全在 LUN 0，没有第二个 LUN 要枚举。
[userdata]
first_lba = 3613096
last_lba  = 123365370      # 实测复核通过 2026-11-08
lba_bytes = 4096

# archives 是**替换**语义：profile/arch/arm64 给了起手 8 项，这里必须写全。
# 存储驱动不在这里，它是 patches/xnu/kirby-ufs.patch 里的 BSD 文件，
# 由 bsd/conf/files 那一行带进构建。
[kernel]
defconfig = "tb321fu_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8650.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  # QcomXnuUsbDebug: USB CDC-ACM debug console, ported from
  # FFT-infra/QcomXnuUsbDebug@18bcc385 (SM8550 + Darwin22) to this SM8650 +
  # Darwin23 board.  Sources live next to this entry in scripts/, which
  # tree.py copies into <tree>/scripts/.  It must come before
  # build-native-mobile-display.py: that builder runs build-xnu-4k-baseline.sh
  # itself to produce a kernel image, and the script's archive block does
  # `test -f libQcomXnuUsbDebug.a`, so the archive has to exist by then.
  "build-qcom-xnu-usb-debug.py",
  "build-libpthread-kernel.py",
  # Mobile display archive, ported from caihong - the same-SoC reference.
  #
  # sheng (SM8550) builds a 28 KB ABI-bound LEGACY backend instead; caihong is
  # the right model here because it shares both the SoC and the iPadOS 17
  # profile, and it is already verified.  Its configs/caihong_defconfig:26-29
  # selects MOBILE_DISPLAY and its archives carry this script, whose only
  # implementation file is kits/caihong/MobileDisplayProviderProbe.cpp (5.6 KB
  # against sheng's Builder).
  #
  # Ported as-is apart from one hardcoded path: line 183 now points at
  # kits/tb321fu/MobileDisplayProviderProbe.cpp, and the probe was copied there.
  "build-native-mobile-display.py",
]

# prelink：从 IPSW 的 kernelcache 里把 kext 链进内核。
#
# 为什么必须有它：这台机器一直用 --skip-prelink 构建，所以
# __PRELINK_TEXT / __PRELINK_INFO / __PRELINK_DATA 全是 0，内核里
# **没有任何 APFS 代码**。userdata 里放的是 APFS 容器，没有 APFS 实现
# 就没有任何东西能把它解析成卷 —— 写进去也挂不上。
#
# 参照 caihong（SM8650，能跑到 launchd）：它的 [kernel.prelink] 里
# apfs 和 IOStorageFamily 都在 roots 里。它的 tool 写的是
# kits/NativePrelink/emit_prelink.py，那是旧名，现在是 XnuPrelink
# （components.toml 里 kind="kit", path="kits/XnuPrelink"，
#  tree.py 会把它链接成 <tree>/kits/XnuPrelink）。
#
# roots 先只放挂根卷最小必需的一组：APFS 本体、存储栈基类、压缩、crypto、
# 信任链。caihong 那 31 项里还有 ApplePMGR / IOAVFamily / IOGPUFamily 等，
# 那些依赖我们没有的硬件或组件，缺 kext 时 emit_prelink 会直接报错。
# 先跑通最小集，缺什么再按报错补。
[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
slide = "-0x1000000"
roots = [
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.kec.corecrypto",
  "com.apple.kec.Libm",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
]

[device_tree]
source = "device:dts/tb321fu.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "tb321fu"
dsc = "Platforms/Lenovo/tb321fuPkg/tb321fu.dsc"
fd = "Build/tb321fuPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]
# TODO: preflight / submodules / patches 待板级固件输入齐备后补。

[firmware.defines]
DEVICE_MODEL = "tb321fu"

# 来自 uefi-kirby-main/Resources/Configs/kirby.toml，已用 fastboot boot 实测可启动。
#
# 设备现在跑的是 TB321FU_HyperOS3_0209（小米平板 7 Pro 的 HyperOS3 移植 ROM，
# Android 16），不是 01-设备输入.md 采集时的 ZUI Android 14。因此下面三条基于
# A14 的旧结论全部作废：
#   - "flash.locked=1 / verifiedbootstate=green" -> 实测 0 / orange，已解锁
#   - "ABL 没有 fastboot boot 命令"             -> 现在可用，今天多次进 UEFI
#   - "FD 基址 0xA7100000 / 0x9FC00000 占位"     -> 下表 base 已三方一致
#
# base 的三方交叉证据（不要改）：
#   - MemoryMapLib.c:82  {"UEFI_FD", 0xF3800000, 0x00400000, ...}  BootShim 拷 FD 到这里
#   - kirby.toml:17      base = 0xF3800000
#   - 实测               fastboot boot 进 UEFI、二维码可解
# 厂商 uefi_a.img 是 ELF64，entry = paddr = 0xA7000000（2.9 MB），那是 ABL 原生加载
# uefi_a 分区的地址，与我们 fastboot boot 路径无关；dsc 把 Info_Blk / Log_Buffer /
# UEFI_Stack 放在 0xA7601000-0xA7ED9000，正是复用 ABL 保证可用的那段 UEFI 窗口。
[bootimg.image]
base = 0xF3800000
pagesize = 4096
header_version = 4

[bootimg]
# dtb = "build/tb321fu/tb321fu.dtb"   # 固件预检脚本生成后再填

[payload]
# GKI 布局实测（TB321FU_HyperOS3_0209/image/，直接解析 boot header）：
#   boot_a.img         header v4, kernel_size = 35289600, ramdisk_size = 0
#   init_boot_a.img    header v4, kernel_size = 0,        ramdisk_size = 2140043
#   vendor_boot_a.img  header v4, vendor_ramdisk_size = 8642898, dtb_size = 5362106
# 分区几何（gpt_main4.bin / rawprogram4.xml）：boot_a 与 vendor_boot_a 各 96 MiB，
# init_boot_a 8 MiB，uefi_a 5 MiB，dtbo_a 24 MiB。
# => payload 是 FAT 卷，只能进 vendor_boot 的 vendor_ramdisk；boot 里没有 ramdisk
#    位置，官方 guide/boot 同样是 ./unixnu bootimg --ramdisk none。
#    阶段 1（UEFI 亮屏）不需要 payload：fastboot boot 只吃 boot.img，BootShim 在
#    kernel 段，今天已实测可进 UEFI。
# 触发 kernel.yml 重跑的标记行；kernel.yml 只监听 devices/** 的变化。
# 上一轮 aa319de 的构建倒在 mockfs 未定义（vfs_conf.o 的 vfstbllist 需要
# mockfs_mountroot / mockfs_vfsops / mockfs_vnodeop_opv_desc），
# 而同一份 archives 在前一轮是成功的，属于间歇性失败。
volume = "TB321FUESP"      # FAT 卷标 ≤ 11 字符
size_mib = 256
loader = "firmware"
title = "Lenovo Legion Y700 (TB321FU)"
dram_size = "0x80000000"   # 交接窗口，不是安装内存；沿用 caihong
panic_screen = true
# 关键：本机定时器中断不工作（实测 BDS 菜单 3 秒超时失效），且 fastboot boot
# 下没有 ConIn。官方 Menu.c:152-155 在 RemainingMs==0 时直接 return DefaultIndex，
# 不创建 EVT_TIMER 事件、不依赖输入设备 → timeout=0 可自动启动默认项。
timeout = 0
# rd=/ufsroot= are deliberately absent.  They route IOFindBSDRoot to the UFS
# block device, and the point of this build is the other branch: /chosen/
# memory-map/RAMDisk, which carries the restore ramdisk named by initrd.  UFS
# stays in the kernel and still runs its own init; it just is not asked for a
# root device.  Putting rd=ufsroot0 back is the one-line way to return to the
# partition route.
kernel_args = ["-v", "serial=3", "offline-apfs-load=1", "-enable_kprintf_spam", "qcom-usb-debug=1"]

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "tb321fu_defconfig"

# 沿用 caihong（同 SoC / 同 IPSW）的 ADT 输入，按格式 2 字段写。
# root_match_volume_uuid 必须等 userdata GPT 实测后由 build-userdata-gpt.py 生成，
# 先用官方模板的 REQUIRED_ 占位，不要猜。
[payload.adt]
chip_id = "207"
# 256 MiB, and it is a measured ceiling, not a preference:
#   * 0x10000000 (256 MiB): AllocateWindow succeeds, the hand-off completes
#     (window 0x10000000, Exiting boot services), then the kernel resets.
#   * 0x40000000 (1 GiB): AllocateWindow FAILS -- 'XNU' returned:
#     Out of Resources.  No 1 GiB contiguous EfiConventionalMemory exists here.
#   * 0x80000000 (2 GiB): same failure.
# So the largest allocatable window on this tablet is between 256 MiB and
# 1 GiB, and kebab's "enlarge the window until arm_vm_init fits" route is not
# available.  Whatever resets the kernel after DarwinEnter is not something a
# bigger window can fix here.
owned_memory_size = "0x10000000"
root_match_volume_uuid = "REQUIRED_ROOT_VOLUME_UUID"
cpu_regs = "0"
psci_method = "smc"
packed_data_ramdisk = false
ipad_identity = true
unique_chip_id = "required"

# ---- MobileGestalt 身份覆盖：让 iPad7,1 的 17.7.11 userland 报成 8 寸 iPad mini 6 ----
#
# 依据 docs/zh/guide/mobilegestalt.md:3「修改身份不需要改动已签名的内核和用户态镜像」；
# 格式 2 用带类型的 [adt.<node>.<type>] 表覆盖 OS profile 的同名属性
# （docs/zh/porting/device-tree.md:83-94）。
#
# 每个值的来源，没有一个是猜的：
#   model             iPad14,1   api.ipsw.me/v4/device/iPad14,1（蜂窝版 iPad14,2）
#   target-type       J310       iPad14,1 的 boardconfig = J310AP，对照 iPad7,1 是 j120ap / J120
#   compatible        J310AP     同上
#   artwork-subtype   2266       双重硬证据：mini 6 的 17.7 IPSW 里启动图叫
#                                applelogo@2266~ipad / batterycharging@2266~ipad；
#                                同一规律在 iPad7,1 上是 applelogo@2224（Pro 10.5）与
#                                applelogo@2732（Pro 12.9），而 profile 的
#                                artwork-device-subtype 正是 2732 → 该值 = 屏幕长边像素
#   scale-factor      2          mini 6 与 iPad7,1 同为 @2x
#   thin-bezel / home-button-type = 1 / 2    mini 6 无 Home 键，走全面屏手势
#
# 明确「不覆盖、继承 profile」的两项，不是漏了：
#   product-id（J120 = e9fefef6e6f9d12a5ba1a2551866cbbd749f0ec3）
#     这是 20 字节值，MGGetProductType() 拿它查 libMobileGestalt 的产品表。要换掉必须先
#     从 DeviceTree.j310ap.im4p 的 bvx2/LZSS 里解出来；不覆盖时客户端仍认它是 J120，
#     但**不会**变成 unknown device（profile.toml:87-88 说的是"没有该属性"才 unknown）。
#   compatible-device-fallback（profile 里是 iPad6,7）
#     只在主设备资源缺失时兜底，先不动。
#
# 验证顺序按 mobilegestalt.md:69：设备名称 → 锁屏提示 → 上滑手势 → 键盘布局。
# 都正确再决定要不要为 product-id 单独解那个 LZSS。
[adt.root.string]
model = "iPad14,1"
target-type = "J310"
compatible = "J310AP"

[adt.product.string]
product-name = "iPad mini (6th generation)"
product-description = "iPad mini (6th generation)"
artwork-device-idiom = "pad"
artwork-display-gamut = "P3"

[adt.product.u32]
artwork-device-subtype = 2266
artwork-scale-factor = 2
thin-bezel = 1

[adt.buttons.u32]
home-button-type = 2
